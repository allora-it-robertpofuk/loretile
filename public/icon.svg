<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- lore + tile: a mosaic being laid — three tiles set, one still open. -->
  <rect width="100" height="100" rx="22" fill="#faf7f2"/>
  <g fill="#7a5c3e">
    <rect x="20" y="20" width="27" height="27" rx="5"/>
    <rect x="53" y="20" width="27" height="27" rx="5" opacity=".7"/>
    <rect x="20" y="53" width="27" height="27" rx="5" opacity=".7"/>
  </g>
  <rect x="53" y="53" width="27" height="27" rx="5" fill="none" stroke="#7a5c3e" stroke-width="2.4" stroke-dasharray="4 3" opacity=".6"/>
</svg>
