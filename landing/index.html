<script>
/* Object Storage 301s http->https, but only after one request went out in
   the clear; the app needs a secure context (OPFS, crypto), so upgrade in
   the page too. */
if (location.protocol === 'http:' && location.hostname !== 'localhost'
    && !/^127\./.test(location.hostname)) {
  location.replace('https://' + location.host + location.pathname
                   + location.search + location.hash);
}
</script>

/* same tokens as the app (public/css/app.css) and kintale's landing */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #171310; --fg: #ece5da; --muted: #a3988a; --card: #211c17;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: background .3s, color .3s; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 20px 60px; }
.brand { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  position: absolute; top: 12px; left: 14px; z-index: 60; height: 30px;
  font-size: 22px; font-weight: 700; color: var(--fg); text-decoration: none; }
.brand img { width: 28px; height: 28px; border-radius: 7px; display: block; }

/* burger — the one control on the page; everything else (theme, language,

#burger { position: fixed; top: 12px; right: 14px; z-index: 60;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);

  display: inline-flex; align-items: center; justify-content: center; }
.scrim { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.4);

@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(100%); } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 95;
  width: min(320px, 88vw); background: var(--card); border-left: 1px solid var(--line);

.drawer .dhead { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }

.mosaic { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;

.road { display: grid; gap: 14px; max-width: 720px; margin: 0 auto; }
.stage { background: var(--card); border: 1px solid var(--line); border-radius: 16px;

footer { margin-top: 90px; padding-top: 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .fcols { display: flex; flex-wrap: wrap; gap: 28px 56px; }
footer .fcol { display: flex; flex-direction: column; gap: 7px; min-width: 180px; }

@media (max-width: 640px) { .hero { padding-top: 44px; } .stage { flex-direction: column; gap: 4px; } }
</style>

const LS_LOC = "loretile-locale", LS_THEME = "loretile-theme";
const pick = () => {
  const saved = localStorage.getItem(LS_LOC);
  if (T[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language])) {
    const c = (l || "").slice(0, 2).toLowerCase();
    if (T[c]) return c;
  }
  return "en";
};
let loc = pick();
const apply = () => {
  document.documentElement.lang = loc;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T[loc][el.dataset.i] || ""; });
  document.querySelectorAll("[data-loc]").forEach(b => b.classList.toggle("on", b.dataset.loc === loc));
  const th = localStorage.getItem(LS_THEME) || "auto";
  document.querySelectorAll("[data-theme]").forEach(b => b.classList.toggle("on", b.dataset.theme === th));
};
document.querySelectorAll("[data-loc]").forEach(b =>
  b.addEventListener("click", () => { loc = b.dataset.loc; localStorage.setItem(LS_LOC, loc); apply(); }));

const savedTheme = localStorage.getItem(LS_THEME);
if (savedTheme && savedTheme !== "auto") document.documentElement.dataset.theme = savedTheme;
document.querySelectorAll("[data-theme]").forEach(b =>
  b.addEventListener("click", () => {
    const t = b.dataset.theme;
    if (t === "auto") { delete document.documentElement.dataset.theme; localStorage.removeItem(LS_THEME); }
    else { document.documentElement.dataset.theme = t; localStorage.setItem(LS_THEME, t); }
    apply();
  }));

const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim"),
      burger = document.getElementById("burger");
const setMenu = open => {
  drawer.hidden = !open; scrim.hidden = !open;
  burger.setAttribute("aria-expanded", String(open));
};
burger.addEventListener("click", () => setMenu(drawer.hidden));
document.getElementById("dclose").addEventListener("click", () => setMenu(false));
scrim.addEventListener("click", () => setMenu(false));
drawer.querySelectorAll("nav a").forEach(a => a.addEventListener("click", () => setMenu(false)));
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

const VER = "@VERSION@";
document.querySelectorAll(".ver").forEach(el => { el.textContent = "v " + (VER.startsWith("@") ? "dev" : VER); });
apply();
</script>
